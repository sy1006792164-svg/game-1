<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f0">
  <title>风笺回廊 · 风起，信至</title>
  <link rel="stylesheet" href="/preview/style.css">
</head>
<body>
  <aside aria-label="游戏介绍与操作指南">
    <header>
      <div class="eyebrow">WIND LETTER CORRIDOR</div>
      <h1>风笺回廊</h1>
      <p class="lead">山间有风，沿途有你。<br><em>三拍之后</em>，回声替你收起蓝票。</p>
    </header>
    <section class="rule" aria-label="操作指南">
      <h2>开始很简单</h2>
      <p class="touch">轻点相邻亮格移动，点脚下格等一拍。<br><strong>长按亮格预览，松手不行动。</strong><br>点上方拍数，查看回声将到哪里。<br>电脑滚轮缩放，放大后拖动查看。</p>
      <div class="keys" aria-label="键盘操作">
        <p><span><kbd>方向键</kbd> / <kbd>WASD</kbd> 移动</span><span><kbd>Space</kbd> 等待</span></p>
        <p><span><kbd>Z</kbd> / <kbd>Backspace</kbd> 回溯</span><span><kbd>Esc</kbd> 暂停</span></p>
        <p><span><kbd>Tab</kbd> / <kbd>Shift+Tab</kbd> 选择</span><span><kbd>Enter</kbd> 确认</span></p>
        <p><span><kbd>1</kbd> / <kbd>2</kbd> / <kbd>3</kbd> / <kbd>4</kbd> 道具</span><span><kbd>Esc</kbd> 取消</span></p>
      </div>
    </section>
  </aside>
  <main id="phone"><canvas id="game" tabindex="0" aria-label="风笺回廊游戏，Tab 或 Shift+Tab 选择按钮、回声拍数和道具目标，Enter 确认。轻点相邻亮格或用方向键、WASD 移动；长按亮格预览，松手不行动。点上方拍数查看回声落点，不耗拍。点脚下格或空格等待，Z 或退格回溯，Esc 暂停。电脑滚轮缩放，放大后拖动查看。"></canvas></main>
  <script src="/preview/bundle.js"></script>
</body>
</html>
