<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112e32">
  <title>风笺回廊 · 林间的三拍回声</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center; gap: clamp(46px, 7vw, 112px);
      color: #f4eddc; background: #0c2429; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background-image: radial-gradient(ellipse at 70% 25%, #2a676450, transparent 48%),
        radial-gradient(ellipse at 20% 100%, #34524250, transparent 55%), linear-gradient(140deg, #102d31, #081a20);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
      background-image: radial-gradient(circle at 14% 19%, #efbd72 0 1px, transparent 2px),
        radial-gradient(circle at 36% 76%, #80cdd7 0 1px, transparent 2px),
        radial-gradient(circle at 89% 52%, #efbd72 0 1px, transparent 2px);
      background-size: 410px 450px, 530px 610px, 690px 520px;
      animation: fireflies 7s ease-in-out infinite alternate;
    }
    aside { position: relative; width: 310px; flex: 0 0 310px; }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: #85b9b7; letter-spacing: 3px; font-size: 10px; }
    .eyebrow::before { content: ""; width: 27px; height: 1px; background: #85b9b7; }
    h1 { font-size: 47px; letter-spacing: 6px; font-weight: 500; margin: 24px 0 17px; }
    .lead { font-size: 20px; line-height: 1.9; color: #dfdac4; margin: 0; }
    .lead em { font-style: normal; color: #efbd72; }
    .rule { margin-top: 37px; padding-top: 24px; border-top: 1px solid #385352; }
    .touch { margin: 0; color: #afc2b8; font-size: 12px; line-height: 2; }
    .touch strong { font-weight: 400; color: #80cdd7; }
    .keys { margin: 18px 0 0; color: #7f9f94; font-size: 10px; line-height: 2; }
    #phone { height: min(844px, 96dvh); aspect-ratio: 390 / 844; position: relative; flex-shrink: 0;
      border: 1px solid #5c797268; box-shadow: 0 35px 100px #020d15bb, 0 0 60px #40736b24;
      border-radius: 30px; overflow: hidden; background: #112e32; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    @keyframes fireflies { from { opacity: .15; transform: translateY(0); } to { opacity: .6; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
    @media (max-width: 850px) {
      aside { display: none; } body { background: #112e32; } body::before { display: none; }
      #phone { height: 100dvh; width: 100%; aspect-ratio: auto; max-width: 500px; border: 0; border-radius: 0; box-shadow: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    }
    @media (max-height: 700px) and (min-width: 851px) {
      h1 { margin: 15px 0 9px; }
      .rule { margin-top: 23px; padding-top: 18px; }
    }
  </style>
</head>
<body>
  <aside aria-label="游戏介绍与操作指南">
    <div class="eyebrow">WIND LETTER CORRIDOR</div>
    <h1>风笺回廊</h1>
    <p class="lead">你拾起信笺。<br><em>三拍后</em>，<br>回声替你收蓝票。</p>
    <section class="rule" aria-label="操作指南">
      <p class="touch">点相邻亮格移动，点脚下格等一拍。<br><strong>左右拖动转向，上下拖动调整俯视。</strong><br>双指捏合缩放、拖动平移；滚轮缩放。</p>
      <p class="keys">方向键 / WASD 移动 · Space 等待<br>Z / Backspace 回溯 · Esc 暂停</p>
    </section>
  </aside>
  <main id="phone"><canvas id="game" tabindex="0" aria-label="风笺回廊游戏，点相邻亮格或用方向键、WASD 移动，点脚下格或空格等待，Z 或退格回溯，Esc 暂停。左右拖动转向，上下拖动调整俯视，双指捏合缩放、拖动平移，滚轮缩放。"></canvas></main>
  <script src="/preview/bundle.js"></script>
</body>
</html>
